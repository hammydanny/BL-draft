<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Lock Auction</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;0,900;1,800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-tech" aria-hidden="true"></div>

    <section id="setup-screen">
        <div class="setup-logo">
            <div class="system-tag">BL // STRIKER SELECTION PROGRAM</div>
            <h1>BLUE LOCK <span>AUCTION</span></h1>
            <p>DRAFT // BID // BUILD YOUR XI</p>
        </div>

        <div class="setup-box">
            <div class="panel-code">SYSTEM_CONFIG // 001</div>
            <div class="setup-section-title">TEAMS</div>

            <div class="team-config team-config-1">
                <div class="team-config-number">01</div>
                <div class="team-config-fields">
                    <label for="team1Name">TEAM 1 NAME</label>
                    <input type="text" id="team1Name" value="TEAM 1" maxlength="20">
                    <label for="team1Color">TEAM 1 COLOR</label>
                    <div class="color-control">
                        <input type="color" id="team1Color" value="#19a7ff">
                        <span id="team1ColorValue">#19A7FF</span>
                    </div>
                </div>
            </div>

            <div class="team-config team-config-2">
                <div class="team-config-number">02</div>
                <div class="team-config-fields">
                    <label for="team2Name">TEAM 2 NAME</label>
                    <input type="text" id="team2Name" value="TEAM 2" maxlength="20">
                    <label for="team2Color">TEAM 2 COLOR</label>
                    <div class="color-control">
                        <input type="color" id="team2Color" value="#ff315d">
                        <span id="team2ColorValue">#FF315D</span>
                    </div>
                </div>
            </div>

            <div class="setup-section-title">AUCTION SETTINGS</div>

            <div class="settings-grid">
                <div>
                    <label for="budget">STARTING BUDGET</label>
                    <input type="number" id="budget" value="15000" min="50" step="50">
                </div>
                <div>
                    <label for="bidIncrement">BID INTERVAL</label>
                    <input type="number" id="bidIncrement" value="50" min="1">
                </div>
            </div>

            <label for="maxPlayers">MAX PLAYERS PER TEAM</label>
            <input type="number" id="maxPlayers" value="15" min="1">

            <button id="startGame" class="primary-button">
                <span>INITIALIZE AUCTION</span><b>→</b>
            </button>
        </div>
    </section>

    <section id="auction-screen" class="hidden">
        <header class="game-header">
            <div>
                <div class="game-header-small">BL // LIVE SELECTION</div>
                <h1>AUCTION <span>ROOM</span></h1>
            </div>
            <div class="header-status"><i></i> SYSTEM LIVE</div>
            <div id="playersRemaining" class="players-remaining"></div>
        </header>
        <div id="auction-content"></div>
    </section>

    <div id="game-overlay" class="game-overlay hidden">
        <div class="overlay-scanline"></div>
        <div id="overlay-content" class="overlay-content"></div>
    </div>

    <script src="players.js"></script>
    <script src="script.js"></script>
</body>
</html>
