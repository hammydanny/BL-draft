<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blue Lock Auction</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- SETUP SCREEN -->

    <div id="setup-screen">

        <h1>BLUE LOCK AUCTION</h1>

        <p>Build your ultimate Blue Lock team.</p>

        <div class="setup-box">

            <label for="team1Name">TEAM 1 NAME</label>
            <input type="text" id="team1Name" value="TEAM 1">

            <label for="team2Name">TEAM 2 NAME</label>
            <input type="text" id="team2Name" value="TEAM 2">

            <label for="budget">TEAM BUDGET</label>
            <input type="number" id="budget" value="15000">

            <label for="bidIncrement">BID INCREMENT</label>
            <input type="number" id="bidIncrement" value="50">

            <label for="maxPlayers">MAX PLAYERS PER TEAM</label>
            <input type="number" id="maxPlayers" value="15">

            <button id="startGame">START AUCTION</button>

        </div>

    </div>


    <!-- AUCTION SCREEN -->

    <div id="auction-screen" class="hidden">

        <h1>BLUE LOCK AUCTION</h1>

        <div id="auction-content">
            <!-- Auction will appear here -->
        </div>

    </div>


    <script src="players.js"></script>
    <script src="script.js"></script>

</body>

</html>
