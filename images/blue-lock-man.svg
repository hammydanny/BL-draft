<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Blue Lock Man">
  <!-- Original project artwork: a faceless training-robot goalkeeper. Replaceable with an approved image. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d3154"/><stop offset=".55" stop-color="#07182a"/><stop offset="1" stop-color="#030a12"/></linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9f4ff"/><stop offset=".45" stop-color="#a9c3d8"/><stop offset="1" stop-color="#5b7790"/></linearGradient>
    <linearGradient id="kit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1aa3ff"/><stop offset="1" stop-color="#0757a8"/></linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4ff3ff"/><stop offset=".5" stop-color="#d8fdff"/><stop offset="1" stop-color="#4ff3ff"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#31d7ff" stop-opacity=".35"/><stop offset="1" stop-color="#31d7ff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <g stroke="#1b4f73" stroke-width="2" opacity=".55" fill="none">
    <path d="M0 120H400M0 200H400M0 280H400M0 360H400M80 0V500M160 0V500M240 0V500M320 0V500"/>
  </g>
  <circle cx="200" cy="210" r="210" fill="url(#glow)"/>
  <!-- goal frame -->
  <path d="M28 470V96H372V470" fill="none" stroke="#e9f4ff" stroke-opacity=".22" stroke-width="10"/>
  <!-- raised gloves -->
  <g>
    <path d="M58 250l-18-92c-2-12 14-17 19-6l9 34-3-46c-1-12 16-13 18-1l6 44 4-50c1-12 18-11 18 1l-2 52 11-40c3-11 19-7 17 5l-16 74 24-14c10-6 19 6 10 14l-52 46z" fill="url(#shell)" stroke="#06131f" stroke-width="5" stroke-linejoin="round"/>
    <path d="M342 250l18-92c2-12-14-17-19-6l-9 34 3-46c1-12-16-13-18-1l-6 44-4-50c-1-12-18-11-18 1l2 52-11-40c-3-11-19-7-17 5l16 74-24-14c-10-6-19 6-10 14l52 46z" fill="url(#shell)" stroke="#06131f" stroke-width="5" stroke-linejoin="round"/>
    <path d="M60 238h50M290 238h50" stroke="#1aa3ff" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- arms -->
  <path d="M86 262l46 96M314 262l-46 96" stroke="#0a3d6e" stroke-width="34" stroke-linecap="round"/>
  <path d="M86 262l46 96M314 262l-46 96" stroke="url(#kit)" stroke-width="24" stroke-linecap="round"/>
  <!-- torso / keeper kit -->
  <path d="M112 500V372c0-40 34-66 88-66s88 26 88 66v128z" fill="url(#kit)" stroke="#06131f" stroke-width="6"/>
  <path d="M146 500l20-170M254 500l-20-170" stroke="#4ff3ff" stroke-opacity=".55" stroke-width="5"/>
  <path d="M168 318l32 30 32-30" fill="none" stroke="#e9f4ff" stroke-width="7" stroke-linejoin="round"/>
  <text x="200" y="438" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="64" font-weight="900" font-style="italic" fill="#e9f4ff" opacity=".92">1</text>
  <!-- neck + head -->
  <rect x="178" y="270" width="44" height="40" rx="6" fill="#5b7790" stroke="#06131f" stroke-width="5"/>
  <path d="M132 192c0-56 30-90 68-90s68 34 68 90c0 46-26 84-68 84s-68-38-68-84z" fill="url(#shell)" stroke="#06131f" stroke-width="6"/>
  <path d="M146 196c10-12 30-18 54-18s44 6 54 18c-6 20-28 30-54 30s-48-10-54-30z" fill="#06131f"/>
  <path d="M156 199c10-8 26-12 44-12s34 4 44 12c-8 12-24 18-44 18s-36-6-44-18z" fill="url(#visor)"/>
  <path d="M200 106v40M168 118l10 30M232 118l-10 30" stroke="#5b7790" stroke-width="4" stroke-linecap="round"/>
  <path d="M136 186h-14v26h14M264 186h14v26h-14" fill="#1aa3ff" stroke="#06131f" stroke-width="4"/>
</svg>
