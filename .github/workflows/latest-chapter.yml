name: Verify latest manga chapter
on:
  schedule:
    - cron: '25 3 * * *'
  workflow_dispatch:
    inputs:
      chapter:
        description: 'Manually verified newest chapter (leave empty to check only)'
        required: false
        type: string
      part:
        description: 'Optional integer part'
        required: false
        type: string
      publication_date:
        description: 'Verified YYYY-MM-DD, or empty if unknown'
        required: false
        type: string
      official_source:
        description: 'Official source URL used for manual verification'
        required: false
        type: string
      verified_latest:
        description: 'I verified that this is the newest published chapter on the official source, not a catalog count or schedule'
        type: boolean
        default: false
      confirm_jump:
        description: 'I independently verified an increase exceeding three chapters'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: latest-chapter-main
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
      - run: node scripts/chapter-tracker-tests.js
      - name: Verify official publication
        run: node scripts/update-latest-chapter.js
        env:
          CHAPTER_NUMBER: ${{ inputs.chapter }}
          CHAPTER_PART: ${{ inputs.part }}
          CHAPTER_DATE: ${{ inputs.publication_date }}
          CHAPTER_SOURCE: ${{ inputs.official_source }}
          CHAPTER_CONFIRMED: ${{ inputs.verified_latest }}
          CHAPTER_CONFIRM_JUMP: ${{ inputs.confirm_jump }}
      - name: Commit chapter data only
        shell: bash
        run: |
          if git diff --quiet -- data/latest-chapter.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/latest-chapter.json
          git commit -m 'Update verified manga publication'
          git fetch origin main
          git rebase origin/main
          node scripts/chapter-tracker-tests.js
          git push origin HEAD:main
